# Builds the launcher on every push. Tags v* publish a GitHub release.
#
# Signing (SignPath Foundation, free for open source): once the project is approved, set in
# Settings > Secrets and variables > Actions:
#   secret   SIGNPATH_API_TOKEN        (CI user token from SignPath)
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG     (e.g. origins-launcher)
# Pushes to main are signed with the "test-signing" policy, tags with "release-signing" (each
# release request is approved by hand in SignPath). Without the variable, signing is skipped.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # releases on tags
      actions: read   # SignPath reads the artifact
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build launcher (.NET Framework 4.8)
        run: dotnet build src/OriginsLauncher/OriginsLauncher.csproj -c Release --nologo

      - name: Build tools
        run: |
          dotnet build tools/UpdateBuilder/UpdateBuilder.csproj -c Release --nologo
          dotnet build tools/DevUpdateServer/DevUpdateServer.csproj -c Release --nologo

      - name: Upload unsigned launcher
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: OriginsLauncher-unsigned
          path: src/OriginsLauncher/bin/Release/net48/OriginsLauncher.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Upload signed launcher
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: OriginsLauncher-signed
          path: signed/OriginsLauncher.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = if (Test-Path signed/OriginsLauncher.exe) { 'signed/OriginsLauncher.exe' } else { 'src/OriginsLauncher/bin/Release/net48/OriginsLauncher.exe' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release create $env:GITHUB_REF_NAME $exe --title "Launcher $env:GITHUB_REF_NAME" --notes "Built by GitHub Actions from $env:GITHUB_SHA. SHA-256: $hash"
